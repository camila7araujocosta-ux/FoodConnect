<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FoodConnect · Configurações</title>

    <link rel="stylesheet" href="../CSS/base.css">
    <link rel="stylesheet" href="../CSS/settings.css">
    <script src="../JAVASCRIPT/app.js" defer></script>
    <script src="../JAVASCRIPT/settings.js" defer></script>
</head>

<body>

    <header class="navbar" id="navbar"></header>

    <main class="container page">

        <div class="card-box config-container">
            <h1>Configurações</h1>

            <div class="section">
                <h3>Perfil</h3>
                <div class="field">
                    <label for="nome">Nome</label>
                    <input type="text" id="nome" placeholder="Digite seu nome">
                </div>
            </div>

            <div class="section">
                <h3>Aparência</h3>
                <label class="opcao">
                    <input type="checkbox" id="tema">
                    Modo escuro
                </label>
            </div>

            <div class="section">
                <h3>Notificações</h3>
                <label class="opcao">
                    <input type="checkbox" id="notificacoes">
                    Receber notificações
                </label>
            </div>

            <div class="section">
                <h3>Idioma</h3>
                <select id="idioma">
                    <option>Português</option>
                    <option>English</option>
                    <option>Español</option>
                </select>
            </div>

            <button class="btn btn-roxo btn-block" id="salvar">Salvar alterações</button>

            <div class="zona-perigo">
                <h3>Zona de perigo</h3>
                <p class="muted">Apaga sua conta de demonstração, doações, XP e insígnias deste navegador.</p>
                <button class="btn btn-secundario" id="apagar">Apagar todos os meus dados</button>
            </div>
        </div>

    </main>

    <footer id="footer"></footer>

</body>

</html>
